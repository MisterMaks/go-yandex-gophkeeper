syntax = "proto3";

package service_2;

option go_package = "github.com/MisterMaks/go-yandex-gophkeeper/api/proto/service_2";

service GoYandexGophkeeper {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);

  rpc CreateData(CreateDataRequest) returns (CreateDataResponse);
  rpc GetDataBatch(GetDataBatchRequest) returns (GetDataBatchResponse);
  rpc UpdateData(UpdateDataRequest) returns (UpdateDataResponse);
  rpc DeleteData(DeleteDataRequest) returns (DeleteDataResponse);
  rpc CreateDataChunk(stream CreateDataChunkRequest) returns (CreateDataChunkResponse);
  rpc GetDataChunk(GetDataChunkRequest) returns (stream GetDataChunkResponse);
  rpc UpdateDataChunk(stream UpdateDataChunkRequest) returns (UpdateDataChunkResponse);
}

message RegisterRequest {
  string login = 1;
  string password = 2;
  bytes public_key = 3;
  bytes private_key_cipher = 4;
}

message RegisterResponse {
  bytes public_key = 1;
  bytes private_key_cipher = 2;
}

message LoginRequest {
  string login = 1;
  string password = 2;
}

message LoginResponse {
  bytes public_key = 1;
  bytes private_key_cipher = 2;
}

enum Type {
  LOGIN_PASSWORD = 0;
  BANK_CARD = 1;
  TEXT = 2;
  BINARY = 3;
}

message CreateDataRequest {
  string name = 1;
  Type type = 2;
  uint64 size_in_bytes = 3;
  bytes data = 4;
}

message CreateDataResponse {
  string id = 1;
}

message GetDataBatchRequest {
  repeated Type types = 1;
}

message GetDataBatchResponse {
  message Data {
    string id = 1;
    string name = 2;
    Type type = 3;
    bytes data = 4;
    bool is_chunked = 5;
  }

  repeated Data data_batch = 1;
}

message UpdateDataRequest {
  string id = 1;
  string name = 2;
  Type type = 3;
  bytes data = 4;
}

message UpdateDataResponse {}

message DeleteDataRequest {
  string id = 1;
}

message DeleteDataResponse {}

message CreateDataChunkRequest {
  string id = 1;
  bytes data_chunk = 2;
}

message CreateDataChunkResponse {}

message GetDataChunkRequest {
  string id = 1;
}

message GetDataChunkResponse {
  bytes data_chunk = 1;
}

message UpdateDataChunkRequest {
  string id = 1;
  bytes data_chunk = 2;
}

message UpdateDataChunkResponse {}
